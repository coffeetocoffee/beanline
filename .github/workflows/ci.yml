name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Nightly: 03:17 UTC. The bench gate compares p99 against the stored
    # reference and fails the run on a regression.
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  ZIG_VERSION: "0.14.1"

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Runner-level timeout (portable across ubuntu/macos/windows shells, where
    # the GNU `timeout` command does not exist): a hung test fails the job
    # instead of burning the 6h runner budget.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is pinned (not macos-latest): Zig 0.14.1's linker
        # integration breaks on the newest runner image (undefined _sigaction
        # et al. when linking the build runner against the macOS 15 SDK).
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: fmt check
        run: zig fmt --check src tests build.zig
      - name: build
        run: zig build -Doptimize=ReleaseSafe
      - name: test
        # The probe runs the test binary directly so per-test `N/M name...OK`
        # lines stream to the log; on a hang the last line names the culprit.
        # `test` stays the gate and runs second for the summary counts.
        # bash on all three OSes (Windows defaults to PowerShell, where the
        # executable-suffix fallback below would not parse).
        shell: bash
        run: |
          zig build test-unit-probe
          ./zig-out/bin/test || ./zig-out/bin/test.exe
          zig build test --summary all

  fuzz:
    name: fuzz gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: fuzz target unit tests
        run: zig build test-fuzz --summary all
      - name: fuzz gate
        run: zig build fuzz-gate --summary all

  bench:
    name: bench (${{ matrix.backend }})
    runs-on: ubuntu-latest
    # Same portable hang protection as build-test (bench is ubuntu-only, but
    # job-level timeouts behave identically on every runner OS).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [postgres, redis]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beanline
          POSTGRES_PASSWORD: beanline
          POSTGRES_DB: beanline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beanline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: build
        run: zig build -Doptimize=ReleaseSafe
      - name: migrate (postgres)
        if: matrix.backend == 'postgres'
        env:
          BEANLINE_DATABASE_URL: postgres://beanline:beanline@localhost:5432/beanline
        run: ./zig-out/bin/beanline migrate
      - name: bench (postgres)
        if: matrix.backend == 'postgres'
        env:
          BEANLINE_DATABASE_URL: postgres://beanline:beanline@localhost:5432/beanline
        run: |
          ./zig-out/bin/beanline bench --workload noop --duration 30 --warmup 5 \
            --workers 8 --queues 2 --report bench-report-postgres.json
      - name: bench (redis)
        if: matrix.backend == 'redis'
        env:
          BEANLINE_REDIS_URL: redis://localhost:6379
        run: |
          ./zig-out/bin/beanline bench --workload noop --duration 30 --warmup 5 \
            --workers 8 --queues 2 --report bench-report-redis.json
      - name: gate against the reference
        if: github.event_name == 'schedule'
        env:
          BEANLINE_DATABASE_URL: postgres://beanline:beanline@localhost:5432/beanline
        run: |
          ./zig-out/bin/beanline bench --workload noop --duration 30 --warmup 5 \
            --workers 8 --queues 2 --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report-${{ matrix.backend }}
          path: bench-report-*.json

  release:
    name: release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, fuzz]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: build release artifacts
        run: ./scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: beanline-binaries
          path: dist/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
