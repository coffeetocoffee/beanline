name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Nightly: 03:17 UTC. The bench gate compares p99 against the stored
    # reference and fails the run on a regression.
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  ZIG_VERSION: "0.14.1"

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Runner-level timeout (portable across ubuntu/macos/windows shells, where
    # the GNU `timeout` command does not exist): a hung test fails the job
    # instead of burning the 6h runner budget.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is pinned (not macos-latest): Zig 0.14.1's linker
        # integration breaks on the newest runner image (undefined _sigaction
        # et al. when linking the build runner against the macOS 15 SDK).
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: fmt check
        run: zig fmt --check src tests build.zig
      - name: build
        run: zig build -Doptimize=ReleaseSafe
      # Test execution deliberately avoids `zig build test` on this matrix.
      #
      # Evidence: every step that ran a test binary *directly* passed on
      # macos-14 in about ten seconds, while every step that ran one *through
      # the Zig build runner* stalled with no output until the job was
      # cancelled at 25 minutes. Across three runs the stall moved between
      # `zig build test` and `zig build test-fuzz` as the build graph changed,
      # which ruled out the test code and pointed at the runner itself. The
      # same `zig build test-fuzz` invocation takes 6s on ubuntu-latest and
      # hangs on macos-14 with the identical Zig 0.14.1 and the identical
      # tests, so this is a Zig 0.14.1 build-runner fault on macOS arm64, not
      # a defect in this repository. This runner image already forced a
      # macos-14 pin for a Zig linker/SDK problem (see the matrix comment).
      #
      # The build runner is still used to *compile* the test binaries; only
      # the running of them is done directly, which is the operation that
      # hangs. Coverage is unchanged: both suites run and both must pass.
      - name: install unit test binary
        shell: bash
        run: zig build test-unit-probe
      - name: install fuzz test binary
        shell: bash
        run: zig build test-fuzz-install
      - name: test unit suite
        # Runs the binary directly so per-test `N/M name...OK` lines stream to
        # the log. Watchdog-guarded so a future hang fails in five minutes
        # with the culprit named, instead of burning the whole job timeout.
        # GNU `timeout` is absent on macOS, so this uses bash job control,
        # which is available in bash on all three runners.
        shell: bash
        run: |
          set -m
          ./zig-out/bin/test & TEST_PID=$!
          ( sleep 300; kill -QUIT "$TEST_PID" 2>/dev/null; kill -TERM "$TEST_PID" 2>/dev/null ) &
          WATCHDOG_PID=$!
          wait "$TEST_PID"; STATUS=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          exit $STATUS
      - name: test fuzz target unit tests
        shell: bash
        run: |
          set -m
          ./zig-out/bin/test-fuzz-tests & TEST_PID=$!
          ( sleep 300; kill -QUIT "$TEST_PID" 2>/dev/null; kill -TERM "$TEST_PID" 2>/dev/null ) &
          WATCHDOG_PID=$!
          wait "$TEST_PID"; STATUS=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          exit $STATUS

  fuzz:
    name: fuzz gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: fuzz target unit tests
        run: zig build test-fuzz --summary all
      - name: fuzz gate
        run: zig build fuzz-gate --summary all

  contract:
    name: contract suite (postgres + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beanline
          POSTGRES_PASSWORD: beanline
          POSTGRES_DB: beanline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beanline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: build
        run: zig build -Doptimize=ReleaseSafe
      - name: migrate (postgres)
        env:
          BEANLINE_DATABASE_URL: postgres://beanline:beanline@localhost:5432/beanline
        run: ./zig-out/bin/beanline migrate
      - name: install contract test binary
        run: zig build test-contract-install
      - name: test contract suite
        env:
          BEANLINE_TEST_DSN: postgres://beanline:beanline@localhost:5432/beanline
          BEANLINE_TEST_REDIS_URL: redis://localhost:6379
          BEANLINE_CONTRACT_REQUIRED: "1"
        shell: bash
        run: |
          set -m
          ./zig-out/bin/test-contract & TEST_PID=$!
          ( sleep 300; kill -QUIT "$TEST_PID" 2>/dev/null; kill -TERM "$TEST_PID" 2>/dev/null ) &
          WATCHDOG_PID=$!
          wait "$TEST_PID"; STATUS=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          exit $STATUS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: fuzz target unit tests
        run: zig build test-fuzz --summary all
      - name: fuzz gate
        run: zig build fuzz-gate --summary all

  bench:
    name: bench (${{ matrix.backend }})
    runs-on: ubuntu-latest
    # Same portable hang protection as build-test (bench is ubuntu-only, but
    # job-level timeouts behave identically on every runner OS).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [postgres, redis]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beanline
          POSTGRES_PASSWORD: beanline
          POSTGRES_DB: beanline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beanline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: build
        run: zig build -Doptimize=ReleaseSafe
      - name: migrate (postgres)
        if: matrix.backend == 'postgres'
        env:
          BEANLINE_DATABASE_URL: postgres://beanline:beanline@localhost:5432/beanline
        run: ./zig-out/bin/beanline migrate
      - name: bench (postgres)
        if: matrix.backend == 'postgres'
        env:
          BEANLINE_DATABASE_URL: postgres://beanline:beanline@localhost:5432/beanline
        run: |
          ./zig-out/bin/beanline bench --workload noop --duration 30 --warmup 5 \
            --workers 8 --queues 2 --report bench-report-postgres.json
      - name: bench (redis)
        if: matrix.backend == 'redis'
        env:
          BEANLINE_REDIS_URL: redis://localhost:6379
        run: |
          ./zig-out/bin/beanline bench --workload noop --duration 30 --warmup 5 \
            --workers 8 --queues 2 --report bench-report-redis.json
      - name: gate against the reference
        if: github.event_name == 'schedule'
        env:
          BEANLINE_DATABASE_URL: postgres://beanline:beanline@localhost:5432/beanline
        run: |
          ./zig-out/bin/beanline bench --workload noop --duration 30 --warmup 5 \
            --workers 8 --queues 2 --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report-${{ matrix.backend }}
          path: bench-report-*.json

  release:
    name: release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, fuzz]
    runs-on: ubuntu-latest
    # checkout needs contents:read and attaching assets to the release needs
    # contents:write; the ghcr.io image push needs packages:write (the
    # workflow-level grant is read-only).
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: build release artifacts
        run: bash scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: beanline-binaries
          path: dist/
      - name: attach assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 ||
            gh release create "${{ github.ref_name }}" --draft --verify-tag --generate-notes
          gh release upload "${{ github.ref_name }}" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/beanline.sbom.json \
            --clobber
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
